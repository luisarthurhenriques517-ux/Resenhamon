function rTeam(){const r=(m,i,s)=>`<div class="row" onclick="vm('${s}',${i})">${art(m.l,m.s,56)}<div style="flex:1"><b>${nm(m)}</b> Lv${m.lv} ${EI[el(m)]}${bar(m)}<small>${m.hp}/${st(m).h} • XP ${m.xp}/${need(m.lv)}</small></div></div>`;
$('mn').innerHTML=`<h2>Equipe (${S.team.length}/6)</h2>${S.team.map((m,i)=>r(m,i,'t')).join('')}<h2>Armazém (${S.box.length})</h2>${S.box.map((m,i)=>r(m,i,'b')).join('')||'<p style="text-align:center">Vazio</p>'}`}
function vm(s,i){const m=(s=='t'?S.team:S.box)[i];dtl(m.l,m.s,m,`${s=='t'&&i>0?`<button onclick="mv('lead',${i})">⭐ Líder</button>`:''}${s=='t'&&S.team.length>1?`<button onclick="mv('box',${i})">📦 Guardar</button>`:''}${s=='b'&&S.team.length<6?`<button onclick="mv('tk',${i})">➕ Equipe</button>`:''}`)}
function mv(k,i){if(k=='lead')[S.team[0],S.team[i]]=[S.team[i],S.team[0]];if(k=='box')S.box.push(S.team.splice(i,1)[0]);if(k=='tk')S.team.push(S.box.splice(i,1)[0]);cl();save();rTeam()}
function dtl(l,s,m,ex=''){const b=L[l],e=b[1],s0=st(m||{l,s,lv:1,xp:0,hp:1}),ev=[16,32];ov(`${art(l,s,120)}<h2>${b[0][s]} ${EI[e]}</h2><p>${E[e]} • <b>${RN[b[2]]}</b>${m?` • Lv${m.lv}`:''}</p><p>${b[7]}</p><p>❤️${s0.h} ⚔️${s0.a} 🛡️${s0.d} 💨${s0.v}</p><p>Habilidades: Investida, <b>${SK[e][s]}</b></p><p>Evolução: ${b[0].map((n,i)=>i==s?`<b>${n}</b>`:n).join(' ➡️ ')}${s<2?`<br><small>Evolui no Lv${ev[s]} ou com 💎</small>`:''}</p>${ex}<button onclick="cl()">Fechar</button>`)}
function rInv(){const k=Object.keys(I).filter(k=>S.it[k]>0);$('mn').innerHTML=`<h2>Inventário</h2><p style="text-align:center">🗡️ Amuleto +${S.g.a*3} ATQ • 🛡️ Escudo +${S.g.d*3} DEF</p>${S.g.r?luckRow():''}${k.map(x=>`<div class="row" onclick="use('${x}')"><span style="font-size:30px">${I[x][1]}</span><b style="flex:1">${I[x][0]}</b>x${S.it[x]}</div>`).join('')||'<p style="text-align:center">Sem itens. Visite a loja!</p>'}`}
function use(k){if(k[0]=='c')return toast('Cápsulas são usadas em batalha!');ov(`<h2>Usar ${I[k][0]} em:</h2>${S.team.map((m,i)=>`<div class="row" onclick="ap('${k}',${i})">${art(m.l,m.s,50)}<span>${nm(m)} Lv${m.lv} (${m.hp}/${st(m).h})</span></div>`).join('')}<button onclick="cl()">Cancelar</button>`)}
function ap(k,i){const m=S.team[i];if(k[0]=='p'){if(m.hp>=st(m).h)return toast('Vida já está cheia!');m.hp=Math.min(st(m).h,m.hp+I[k][3])}
if(k=='st'){if(m.s>=2)return toast('Já está no estágio final!');evo(m)}if(k=='xp'||k=='xl'){if(m.lv>=60)return toast('Já está no nível máximo!');gain(m,k=='xl'?need(m.lv)-m.xp:200)}S.it[k]--;save();snd(800);cl();if(EV.length)ending('Evolução!','');rInv()}
function rShop(){const gi=[['ga','🗡️','Amuleto de Força (+3 ATQ)',400*(S.g.a+1),'Nível '+S.g.a+'/10',S.g.a>=10],['gd','🛡️','Escudo Mágico (+3 DEF)',400*(S.g.d+1),'Nível '+S.g.d+'/10',S.g.d>=10],['gr','🍀','Amuleto da Sorte (monstros mais raros)',1500,S.g.r?'Comprado • '+(amOn()?'Ativado':'Desativado'):'Compra única',!!S.g.r]];
$('mn').innerHTML=`<h2>🛒 Loja</h2>${Object.keys(I).map(k=>`<div class="row"><span style="font-size:28px">${I[k][1]}</span><div style="flex:1"><b>${I[k][0]}</b><br><small>${k[0]=='c'?'Captura x'+I[k][3]:k[0]=='p'?'Cura '+I[k][3]+' HP':k=='st'?'Evolui um monstro':k=='xl'?'Sobe 1 nível inteiro':'+200 XP'} • Tem: ${S.it[k]||0}</small></div><button onclick="buy('${k}')">🪙${I[k][2]}</button></div>`).join('')}<h3>Equipamentos</h3>${gi.map(g=>`<div class="row"><span style="font-size:28px">${g[1]}</span><div style="flex:1"><b>${g[2]}</b><br><small>${g[4]}</small></div>${g[0]=='gr'&&S.g.r?`<button onclick="tgA()">${amOn()?'Desativar':'Ativar'}</button>`:`<button ${g[5]?'disabled':''} onclick="buy('${g[0]}',${g[3]})">🪙${g[3]}</button>`}</div>`).join('')}`}
function buy(k,p){p=p||I[k][2];if(S.coins<p)return toast('Moedas insuficientes!');S.coins-=p;if(k=='ga')S.g.a++;else if(k=='gd')S.g.d++;else if(k=='gr'){if(S.g.r)return;S.g.r=1;S.g.o=1}else S.it[k]=(S.it[k]||0)+1;save();snd(700);rMn()}
function rDex(){const n=Object.values(S.dex).filter(v=>v==2).length;$('mn').innerHTML=`<h2>📖 MonstroDex ${n}/${L.length*3}</h2><div class="g3">${L.flatMap((b,l)=>[0,1,2].map(s=>{const v=S.dex[l*3+s];return`<div class="cd" ${v?`onclick="dtl(${l},${s})"`:''}><div class="${v?'':'dark'}">${art(l,s,64)}</div>${v?b[0][s]:'???'}<br>${v==2?'✅':v?'👁️':'❔'}</div>`})).join('')}</div>`}
function rMis(){const d=new Date().toDateString();if(S.m.d!=d)S.m={d,p:[0,0,0],c:[0,0,0]};const T=[['Vença 3 batalhas',3,120],['Capture 1 monstro',1,200],['Derrote 1 treinador',1,250]];
$('mn').innerHTML=`<h2>📜 Missões Diárias</h2>${T.map((t,i)=>`<div class="row"><div style="flex:1"><b>${t[0]}</b><br><small>${S.m.p[i]}/${t[1]} • 🪙${t[2]}</small></div><button ${S.m.c[i]||S.m.p[i]<t[1]?'disabled':''} onclick="claim(${i},${t[2]})">${S.m.c[i]?'✅':'Resgatar'}</button></div>`).join('')}<h2>👑 Chefes</h2>${R.slice(0,6).map((r,i)=>`<div class="row">${r.i} <b style="flex:1">${r.n}</b>${S.bd.includes(i)?'✅':i<S.u?'⚔️':'🔒'}</div>`).join('')}${S.u>=6?'<div class="row">🌌 <b style="flex:1">Santuário Secreto</b>🔓</div>':''}`}
function claim(i,c){S.m.c[i]=1;S.coins+=c;save();snd(880);rMn()}
function rSet(){$('mn').innerHTML=`<h2>⚙️ Ajustes</h2><button style="width:100%" onclick="S.set.snd^=1;save();rSet()">🔊 Som: ${S.set.snd?'Ligado':'Desligado'}</button><button style="width:100%" onclick="S.set.fx^=1;save();rSet()">💥 Efeitos de batalha: ${S.set.fx?'Ligados':'Desligados'}</button><button style="width:100%" onclick="rCode()">🎟️ Inserir código</button><button style="width:100%" onclick="save();toast('Jogo salvo!')">💾 Salvar agora</button><button style="width:100%" onclick="go('menu')">🏠 Menu inicial</button><button style="width:100%;background:#a22" onclick="if(confirm('Apagar todo o progresso?')){try{localStorage.removeItem('mm1')}catch(e){}S=def();go('menu')}">🗑️ Apagar progresso</button><p style="text-align:center"><small>Fogo vence Planta/Gelo • Água vence Fogo/Terra • Planta vence Água/Terra • Elétrico vence Água • Terra vence Elétrico/Fogo • Gelo vence Planta/Terra • Sombrio ↔ Luz. O jogo salva automaticamente.</small></p>`}
S=load()||def();rMn();
</script></body></html>
